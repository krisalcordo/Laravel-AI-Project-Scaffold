name: __PROJECT_SLUG__
type: laravel
docroot: public
php_version: "8.3"
nodejs_version: "22"
webserver_type: nginx-fpm
xdebug_enabled: false
database:
    type: postgres
    version: "16"
composer_version: "2"
corepack_enable: false
use_dns_when_possible: true

# Vite runs inside the web container. The DDEV router terminates TLS on the
# HTTPS port; keep this synchronized with vite.config.js.
web_extra_exposed_ports:
    - name: vite
      container_port: 5173
      http_port: 5172
      https_port: 5173

# Worktree preview hostnames and ports are generated into
# config.preview.yaml by .ddev/generate-preview-slots.sh.

